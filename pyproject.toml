[project]
name = "wican-cli"
version = "0.4.0"
description = "Command-line tool for managing WiCAN Pro OBD-II devices"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.10"
authors = [
    { name = "Philip Kocanda", email = "philip@kocanda.nl" },
]
keywords = ["wican", "obd2", "can-bus", "automotive", "elm327"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "argcomplete>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "responses>=0.25",
]

[project.scripts]
wican = "wican_cli.cli:main"

[project.urls]
Homepage = "https://github.com/philipkocanda/wican-cli"
Repository = "https://github.com/philipkocanda/wican-cli"
Issues = "https://github.com/philipkocanda/wican-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wican_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
